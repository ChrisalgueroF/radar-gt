name: Recolectar noticias y generar borradores

on:
  schedule:
    - cron: "0 * * * *"   # cada hora, en punto (UTC)
  workflow_dispatch:        # también lo puedes correr manualmente desde GitHub

permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Recolectar RSS
        run: node fetch-feeds.js

      - name: Generar borradores de análisis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node analyze.js

      - name: Guardar cambios en el repo
        run: |
          git config user.name "radar-gt-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/noticias.json data/analisis.json
          git diff --staged --quiet || git commit -m "Actualizar noticias y borradores [auto]"
          git push
