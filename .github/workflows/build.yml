name: Generar sitio

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "generate-site.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generar public/index.html
        run: node generate-site.js

      - name: Publicar cambios
        run: |
          git config user.name "radar-gt-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/index.html
          git diff --staged --quiet || git commit -m "Regenerar sitio [auto]"
          git push
